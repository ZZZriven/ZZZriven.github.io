<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4eb">
  <title>慢慢骑 · 鹈鹕的海岸骑行</title>
  <style>
    :root { color-scheme: light; --paper:#f7f4eb; --ink:#29443e; --muted:#697971; --line:#dcded1; --accent:#dc6845; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--paper); color:var(--ink); font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; display:grid; place-items:center; padding:28px; }
    main { width:min(1100px,100%); }
    .masthead { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:0 3px 22px; }
    .brand { display:flex; gap:11px; align-items:center; font-size:12px; font-weight:750; letter-spacing:2.1px; }
    .brand svg { width:36px; height:30px; }
    .edition { color:var(--muted); font-size:11px; letter-spacing:1.5px; }
    .postcard { border:1px solid #d8ddcc; border-radius:20px; overflow:hidden; background:#faf5e8; box-shadow:0 18px 60px #2c473709; }
    .scene { position:relative; overflow:hidden; isolation:isolate; }
    .scene > svg { width:100%; height:auto; display:block; }
    .intro { position:absolute; left:4.5%; top:6.5%; z-index:1; pointer-events:none; }
    .eyebrow { font-size:10px; font-weight:650; letter-spacing:3px; color:#718274; margin:0 0 14px; }
    h1 { margin:0; font-size:clamp(23px,3.2vw,38px); line-height:1.5; letter-spacing:3px; font-weight:650; }
    .intro p:last-child { font-size:12px; margin:14px 0 0; color:var(--muted); letter-spacing:1px; }
    .weather { position:absolute; right:4.5%; top:7%; font-size:10px; color:#6d7d70; letter-spacing:2px; }
    .controls { display:flex; align-items:center; justify-content:space-between; gap:24px; padding:23px 34px; background:#fcfaf3; border-top:1px solid #e4e3d5; }
    .transport { display:flex; gap:15px; align-items:center; }
    button { font:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    button:focus-visible, input:focus-visible { outline:3px solid #d88051; outline-offset:5px; }
    .play { width:49px; height:49px; border:0; border-radius:50%; color:#faf5e8; background:var(--ink); display:grid; place-items:center; transition:background .2s, transform .2s; }
    .play:hover { background:#3e6559; transform:translateY(-2px); }
    .play svg { width:19px; height:19px; }
    .status { display:flex; flex-direction:column; gap:5px; min-width:115px; }
    .status strong { font-size:13px; font-weight:600; letter-spacing:1px; }
    .status small { font-size:10px; letter-spacing:1.1px; color:var(--muted); }
    .speed { display:flex; align-items:center; gap:16px; font-size:12px; }
    .speed output { font-variant-numeric:tabular-nums; min-width:37px; color:var(--accent); font-weight:600; }
    input[type=range] { width:150px; height:5px; accent-color:var(--ink); cursor:pointer; }
    .bell { border:1px solid var(--line); border-radius:25px; background:transparent; padding:12px 16px; color:var(--ink); display:flex; align-items:center; gap:8px; font-size:12px; white-space:nowrap; }
    .bell:hover { background:#f1eddf; }
    .bell svg { height:18px; width:18px; }
    footer { display:flex; justify-content:space-between; gap:20px; padding:19px 3px 0; color:#788078; font-size:10px; letter-spacing:1px; }
    .dot { width:5px; height:5px; border-radius:50%; background:#86a08d; display:inline-block; vertical-align:middle; margin-right:8px; }
    .toast { position:absolute; left:64%; top:36%; color:#29443e; font-size:22px; font-weight:600; opacity:0; pointer-events:none; transform:translateY(0) rotate(-8deg); }
    .toast.ringing { animation:ding 1.2s ease-out both; }
    @keyframes ding { 0% { opacity:0; transform:translateY(8px) rotate(-8deg); } 20%,65% { opacity:1; } 100% { opacity:0; transform:translateY(-24px) rotate(4deg); } }
    @media (max-width:650px) {
      body { padding:16px; } .masthead { padding-bottom:16px; } .brand { font-size:10px; letter-spacing:1.2px; } .edition { font-size:9px; letter-spacing:.5px; }
      .scene { padding-top:107px; } .scene > svg { width:140%; max-width:none; margin-left:-22%; }
      .intro { top:23px; left:24px; } .eyebrow { font-size:8px; margin-bottom:8px; letter-spacing:2px; }
      h1 { font-size:25px; line-height:1.3; letter-spacing:1px; } h1 br { display:none; }
      .intro p:last-child { font-size:10px; margin-top:9px; } .weather { top:29px; right:20px; font-size:8px; letter-spacing:1px; }
      .controls { padding:18px; gap:18px 10px; flex-wrap:wrap; } .transport { gap:10px; } .play { width:42px; height:42px; }
      .status strong { font-size:12px; } .status small { font-size:9px; } .status { min-width:0; }
      .speed { order:3; width:100%; padding-top:14px; border-top:1px solid #e4e3d5; gap:13px; } input[type=range] { flex:1; width:auto; }
      .bell { padding:10px 12px; } footer { font-size:9px; letter-spacing:.4px; } .keyboard-hint { display:none; }
      .toast { top:45%; left:65%; font-size:18px; }
    }
    @media (prefers-reduced-motion:reduce) { .toast.ringing { animation:none; } button { transition:none; } }
  </style>
</head>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const ns = 'http://www.w3.org/2000/svg';
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  let paused = reducedMotion.matches;
  let speed = 1;
  let elapsed = 0;
  let previousTime = null;
  let audioContext;
  let dingTimeout;
  const tau = Math.PI * 2;
  const wheelRadius = 82;
  const cadence = 0.62; // Crank revolutions per second at normal speed.
  const gearRatio = 1.45;
  const travelSpeed = cadence * tau * gearRatio * wheelRadius;
  const crank = { x:558, y:474, radius:34 };
  const clouds = [...document.querySelectorAll('[data-cloud]')].map(el => ({el, data:el.dataset.cloud.split(',').map(Number)}));
  const plants = [...document.querySelectorAll('[data-plant]')].map(el => ({el, data:el.dataset.plant.split(',').map(Number)}));
  // A shared SVG definition keeps both wheels identical.
  const spokeGroup = document.querySelector('.spokes');
  for (let i=0; i<16; i++) {
    const a=i*tau/16;
    const line=document.createElementNS(ns,'line');
    line.setAttribute('x1', Math.cos(a)*8);
    line.setAttribute('y1', Math.sin(a)*8);
    line.setAttribute('x2', Math.cos(a)*69);
    line.setAttribute('y2', Math.sin(a)*69);
    spokeGroup.appendChild(line);
  }
  const mod = (value, period) => ((value % period) + period) % period;
  const number = value => value.toFixed(2);
  const set = (id, attr, value) => $(id).setAttribute(attr, value);
  // Two-bone inverse kinematics: each webbed foot stays attached to its pedal.
  function legPath(hip, foot) {
    const upper=83, lower=86;
    const dx=foot.x-hip.x, dy=foot.y-hip.y;
    const distance=Math.hypot(dx,dy);
    const along=(upper*upper-lower*lower+distance*distance)/(2*distance);
    const height=Math.sqrt(Math.max(0,upper*upper-along*along));
    const knee={x:hip.x+dx*along/distance+dy*height/distance,
                y:hip.y+dy*along/distance-dx*height/distance};
    return `M${hip.x} ${hip.y} L${number(knee.x)} ${number(knee.y)} L${number(foot.x)} ${number(foot.y)}`;
  }
  function render(t) {
    const a=t*cadence*tau;
    const spin=mod(a*gearRatio*180/Math.PI,360);
    const bob=Math.sin(a*2)*1.7;
    set('rear-wheel','transform',`rotate(${spin})`);
    set('front-wheel','transform',`rotate(${spin})`);
    set('pelican-body','transform',`translate(0 ${number(bob)})`);
    set('chainring','transform',`rotate(${a*180/Math.PI} 558 474)`);
    const near={x:crank.x+Math.cos(a)*crank.radius,y:crank.y+Math.sin(a)*crank.radius};
    const far={x:crank.x-Math.cos(a)*crank.radius,y:crank.y-Math.sin(a)*crank.radius};
    set('cranks','d',`M${number(far.x)} ${number(far.y)}L${number(near.x)} ${number(near.y)}`);
    const nearPath=legPath({x:510,y:352+bob},{x:near.x,y:near.y-7});
    set('near-leg','d',nearPath); set('near-leg-outline','d',nearPath);
    set('far-leg','d',legPath({x:500,y:351+bob},{x:far.x,y:far.y-7}));
    set('near-foot','d',`M${number(near.x-9)} ${number(near.y-5)}q9-9 19-3l10 8h-32Z`);
    set('far-foot','d',`M${number(far.x-8)} ${number(far.y-4)}h25`);
    set('near-pedal','d',`M${number(near.x-14)} ${number(near.y+4)}h32`);
    set('far-pedal','d',`M${number(far.x-14)} ${number(far.y+3)}h30`);
    const flutter=Math.sin(t*8)*5;
    set('scarf-tail','d',`M554 225C523 224 505 ${199+flutter} 469 ${216+flutter}l10 8-6 10c39-8 47 ${14-flutter} 79 ${11-flutter}Z`);
    set('scarf-tail-line','d',`M481 ${222+flutter}q37-8 68 ${16-flutter}`);
    const blink = mod(t,4.9)>4.69;
    set('eye','opacity',blink?'0':'1'); set('closed-eye','opacity',blink?'1':'0');
    // The road and wheels use the same travel distance (no visible sliding).
    const distance=t*travelSpeed;
    set('road-dashes','patternTransform',`translate(${-mod(distance,230)} 0)`);
    set('grass-pattern','patternTransform',`translate(${-mod(distance*.75,365)} 0)`);
    set('sea-lines','patternTransform',`translate(${-mod(distance*.08,290)} 0)`);
    clouds.forEach(({el,data:[x,y,rate]}) => el.setAttribute('x',number(mod(x-t*rate+140,1380)-140)));
    plants.forEach(({el,data:[x,y]}) => el.setAttribute('x',number(mod(x-distance*.75+80,1260)-80)));
    set('sailboat','transform',`translate(${number(953-Math.sin(t*.1)*22)} ${number(378+Math.sin(t*1.2)*2)})`);
    set('gulls','transform',`translate(${number(Math.sin(t*.4)*8)} ${number(Math.sin(t*1.6)*3)})`);
    set('wind','opacity',number(.45+Math.sin(t*4)*.18));
    set('bike-shadow','rx',number(205+Math.sin(a*2)*2));
  }
  function syncPlayback() {
    $('play').setAttribute('aria-label',paused?'播放动画':'暂停动画');
    $('play').setAttribute('aria-pressed',String(paused));
    $('play-icon').setAttribute('d',paused?'M6 3 17 10 6 17Z':'M5 3h3v14H5zM12 3h3v14h-3z');
    $('ride-status').textContent=paused?'停下来，看海':'正在兜风';
  }
  function togglePlayback() { paused=!paused; syncPlayback(); }
  $('play').addEventListener('click',togglePlayback);
  $('speed').addEventListener('input',event => {
    speed=Number(event.target.value);
    $('speed-output').textContent=`${speed.toFixed(2)}×`;
    $('speed').setAttribute('aria-valuetext',`${speed} 倍速`);
  });
  // Audio is synthesized locally and only starts after an explicit interaction.
  async function ringBell() {
    $('ding').classList.remove('ringing');
    void $('ding').offsetWidth;
    $('ding').classList.add('ringing');
    clearTimeout(dingTimeout);
    dingTimeout=setTimeout(()=>$('ding').classList.remove('ringing'),1250);
    try {
      const Audio=window.AudioContext || window.webkitAudioContext;
      if (!Audio) return;
      audioContext ||= new Audio();
      if (audioContext.state==='suspended') await audioContext.resume();
      const now=audioContext.currentTime;
      [0,.16].forEach((delay,index)=>{
        [1,2.76].forEach((partial)=>{
          const oscillator=audioContext.createOscillator();
          const gain=audioContext.createGain();
          const start=now+delay;
          oscillator.type='sine';
          oscillator.frequency.value=(index?1370:1540)*partial;
          gain.gain.setValueAtTime(0,start);
          gain.gain.linearRampToValueAtTime(partial===1?.11:.025,start+.006);
          gain.gain.exponentialRampToValueAtTime(.0001,start+.75);
          oscillator.connect(gain); gain.connect(audioContext.destination);
          oscillator.start(start); oscillator.stop(start+.8);
          oscillator.onended=()=>{oscillator.disconnect();gain.disconnect();};
        });
      });
    } catch (_) { /* The visual bell still works if browser audio is unavailable. */ }
  }
  $('bell').addEventListener('click',ringBell);
  document.addEventListener('keydown',event=>{
    if (event.target.closest('button,input,textarea,select,[contenteditable="true"]') || event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
    if (event.code==='Space') { event.preventDefault();togglePlayback(); }
    if (event.key.toLowerCase()==='b') ringBell();
  });
  reducedMotion.addEventListener('change',event=>{ if(event.matches) {paused=true;syncPlayback();} });
  document.addEventListener('visibilitychange',()=>{previousTime=null;});
  function frame(timestamp) {
    if(previousTime===null) previousTime=timestamp;
    const dt=Math.min((timestamp-previousTime)/1000,.05);
    previousTime=timestamp;
    if(!paused && !document.hidden) { elapsed+=dt*speed;render(elapsed); }
    requestAnimationFrame(frame);
  }
  render(0);syncPlayback();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
